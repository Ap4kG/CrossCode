version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Monaco/VS Code packages must be upgraded together.
      codingame-monaco:
        patterns:
          - "@codingame/*"
          - "monaco-editor"
          - "vscode"
      mui:
        patterns:
          - "@mui/*"
    ignore:
      # Tauri 2 plugins are released in lockstep with the CLI; upgrades are
      # handled manually so the Rust and JS sides stay in sync.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri*"
      idevice:
        patterns:
          - "idevice*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
